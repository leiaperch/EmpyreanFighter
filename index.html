let actx = null, musicEl = null, musicOn = true, musicWanted = false;

function tone(freq, dur, type, vol, slide) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), actx.currentTime + dur);
  g.gain.value = vol || 0.15;
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
function noise(dur, vol) {
  if (!actx) return;
  const n = actx.sampleRate * dur, buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();

}

// ---------------------------------------------------------------- Input
// Actions logiques : left right up down L (léger) H (lourd) K (pied) S (spécial) start
// Les touches sont des codes PHYSIQUES (KeyW = la touche à la place de W, soit Z sur AZERTY) ;
// les libellés affichés suivent la disposition réelle du clavier (voir keyLabel).
const ACTIONS = ['left', 'right', 'up', 'down', 'L', 'H', 'K', 'S', 'start'];
const ACTION_LABELS = { left: 'Gauche', right: 'Droite', up: 'Saut', down: 'Accroupir', L: 'Coup léger', H: 'Coup lourd', K: 'Coup de pied', S: 'Spécial', start: 'Start / valider' };
const PRESETS = {
  arrows_azer:   { name: 'Flèches + AZER',  left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], L: ['KeyQ'], H: ['KeyW'], K: ['KeyE'], S: ['KeyR'], start: ['Enter'] },
  arrows_numpad: { name: 'Flèches + pavé num.', left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], L: ['Numpad1', 'Comma'], H: ['Numpad2', 'Period'], K: ['Numpad3', 'Slash'], S: ['Numpad5', 'ShiftRight'], start: ['NumpadEnter', 'Enter'] },
  zqsd_fghj:     { name: 'ZQSD + FGHJ',     left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], L: ['KeyF'], H: ['KeyG'], K: ['KeyH'], S: ['KeyJ'], start: ['Space'] },
  zqsd_jkli:     { name: 'ZQSD + JKL I',    left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], L: ['KeyJ'], H: ['KeyK'], K: ['KeyL'], S: ['KeyI'], start: ['Space'] },

const PRESET_IDS = Object.keys(PRESETS);
function presetBinds(id) { const p = PRESETS[id], b = { preset: id }; ACTIONS.forEach(a => b[a] = p[a].slice()); return b; }

try { const saved = JSON.parse(localStorage.getItem('ef_binds') || 'null'); if (saved && saved.length === 2 && ACTIONS.every(a => saved[0][a] && saved[1][a])) binds = saved; } catch (e) {}
function saveBinds() { try { localStorage.setItem('ef_binds', JSON.stringify(binds)); } catch (e) {} updateHint(); }
// code physique → [joueur, action]
let codeMap = {};
function rebuildCodeMap() { codeMap = {}; binds.forEach((b, i) => ACTIONS.forEach(a => b[a].forEach(code => { (codeMap[code] = codeMap[code] || []).push([i, a]); }))); }
rebuildCodeMap();
function bindConflicts() { const out = []; for (const code in codeMap) if (codeMap[code].length > 1) out.push(code); return out; }

function resolve2pConflict() {

try { if (navigator.keyboard && navigator.keyboard.getLayoutMap) navigator.keyboard.getLayoutMap().then(m => { layoutMap = m; updateHint(); }).catch(() => {}); } catch (e) {}
const learned = {};      // code → caractère réellement produit (appris à chaque frappe)

const AZERTY = { KeyQ: 'A', KeyW: 'Z', KeyA: 'Q', KeyZ: 'W', KeyM: ',', Semicolon: 'M', Comma: ';', Period: ':', Slash: '!', Quote: 'ù', BracketLeft: '^', BracketRight: '$', Minus: ')', Equal: '=', Backquote: '²', Backslash: '*', IntlBackslash: '<' };
const FIXED = { Comma: ',', Period: '.', Slash: '/', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']', Minus: '-', Equal: '=', Backquote: '`', Backslash: '\\', IntlBackslash: '<', Delete: 'Suppr', Insert: 'Inser', Home: 'Début', End: 'Fin', PageUp: 'Page ↑', PageDown: 'Page ↓', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Space: 'Espace', Enter: 'Entrée', NumpadEnter: 'Entrée num.', ShiftLeft: 'Maj G', ShiftRight: 'Maj D', ControlLeft: 'Ctrl G', ControlRight: 'Ctrl D', AltLeft: 'Alt', AltRight: 'Alt Gr', Tab: 'Tab', Backspace: 'Retour', CapsLock: 'Verr. maj', NumpadAdd: 'Num +', NumpadSubtract: 'Num −', NumpadMultiply: 'Num ×', NumpadDivide: 'Num ÷', NumpadDecimal: 'Num .' };
function keyLabel(code) {
  if (layoutMap && layoutMap.get(code)) return layoutMap.get(code).toUpperCase();
  if (azerty && AZERTY[code]) return AZERTY[code];
  if (FIXED[code]) return FIXED[code];
  if (learned[code]) return learned[code].toUpperCase();
  if (/^Numpad/.test(code)) return 'Num ' + code.slice(6);
  if (/^Key/.test(code)) return code.slice(3);
  if (/^Digit/.test(code)) return code.slice(5);

}

class Input {

  poll() {
    this.prev = { ...this.cur };
    const c = { ...this.raw };
    // un appui relâché avant le prochain poll compte quand même une frame
    ACTIONS.forEach(a => { if (this.latch[a]) { c[a] = true; this.latch[a] = false; } });
    // Manette (index = joueur), optionnelle
    let pads = []; try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) { /* iframe sans permission gamepad */ }
    const gp = pads && pads[this.idx];
    if (gp) {
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);

      c.right = c.right || ax > 0.5  || b(15);
      c.up    = c.up    || ay < -0.5 || b(12);
      c.down  = c.down  || ay > 0.5  || b(13);

// Repli quand e.code est vide (certains claviers virtuels / automatisation) : on déduit le code depuis e.key
function keyCode(e) {

    if (code === 'Escape') { keysUI.rebinding = false; return; }
    const a = KEYS_ROWS[keysUI.row];
    binds[keysUI.col][a] = [code]; binds[keysUI.col].preset = 'custom';

  }
  if (code === 'Escape') { game.screen = 'title'; game.t = 0; return; }

  if (code === 'ArrowDown') { keysUI.row = (keysUI.row + 1) % KEYS_ROWS.length; SFX.select(); }

  const bar = (p, x, dir) => {
    const fac = FACTIONS[p.def.faction];
    c.fillStyle = '#111'; c.fillRect(x - 3, y - 3, bw + 6, bh + 6);
    c.fillStyle = '#3a0a0a'; c.fillRect(x, y, bw, bh);
    const ratio = Math.max(0, p.hp / p.def.hp), fw = bw * ratio;
    c.fillStyle = ratio > 0.3 ? '#ffd21e' : '#ff3a2a';
    c.fillRect(dir > 0 ? x : x + bw - fw, y, fw, bh);
    c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(dir > 0 ? x : x + bw - fw, y, fw, 6);
    // super meter
    const mw = 200, my = y + bh + 8;
    c.fillStyle = '#111'; c.fillRect(dir > 0 ? x : x + bw - mw, my, mw, 8);
    const mr = p.meter / METER_MAX; c.fillStyle = mr >= 1 ? (Math.floor(game.t / 6) % 2 ? '#fff' : fac.color) : fac.color;
    c.fillRect(dir > 0 ? x : x + bw - mw * mr, my, mw * mr, 8);
    // nom et faction
    c.font = 'bold 18px Cinzel, Impact, Arial Black, sans-serif'; c.textAlign = dir > 0 ? 'left' : 'right'; c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = 3;
    const nm = p.def.name + '  ·  ' + fac.name; c.strokeText(nm, dir > 0 ? x : x + bw, my + 26); c.fillText(nm, dir > 0 ? x : x + bw, my + 26);
    // victoires
    for (let i = 0; i < 2; i++) { c.fillStyle = i < p.wins ? '#ffd21e' : '#333'; c.beginPath(); c.arc(dir > 0 ? x + bw - 14 - i * 22 : x + 14 + i * 22, my + 20, 7, 0, Math.PI * 2); c.fill(); c.strokeStyle = '#000'; c.lineWidth = 2; c.stroke(); }
    // portrait
    const im = IMG['portrait_' + p.def.id], px = dir > 0 ? x - 66 : x + bw + 6, size = 60;
    c.fillStyle = fac.color; c.fillRect(px - 2, y - 5, size + 4, size + 4);
    if (im) c.drawImage(im, px, y - 3, size, size); else { c.fillStyle = '#222'; c.fillRect(px, y - 3, size, size); }
  };
  bar(p0, 80, 1); bar(p1, W - 80 - bw, -1);
  // timer
  c.fillStyle = '#111'; c.fillRect(W / 2 - 40, 14, 80, 46);
  c.font = 'bold 36px Cinzel, Impact, Arial Black, sans-serif'; c.textAlign = 'center'; c.fillStyle = game.timer <= 10 ? '#ff3a2a' : '#fff';
  c.fillText(String(game.timer).padStart(2, '0'), W / 2, 50);
  // combo
  game.p.forEach((p, i) => { if (p.comboHits >= 2 && p.comboTimer > 0) { const o = game.p[1 - i]; c.font = 'bold 30px Cinzel, Impact'; c.textAlign = i === 0 ? 'right' : 'left'; c.fillStyle = '#ffd21e'; c.strokeStyle = '#000'; c.lineWidth = 4; const s = p.comboHits + ' HITS'; const x = i === 0 ? W - 80 : 80; c.strokeText(s, x, 130); c.fillText(s, x, 130); } });
}
function drawBanner(c) {
  if (!game.banner || game.bannerT <= 0) return;
  game.bannerT--;
  const k = Math.min(1, (60 - Math.min(60, game.bannerT)) / 10);
  c.save(); c.translate(W / 2, H / 2 - 30); c.scale(1 + (1 - k) * 0.6, 1 + (1 - k) * 0.6);
  c.font = 'bold 84px Cinzel, Impact, Arial Black, sans-serif'; c.textAlign = 'center';
  c.lineWidth = 10; c.strokeStyle = '#000'; c.strokeText(game.banner, 0, 0);
  const g = c.createLinearGradient(0, -60, 0, 20); g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#ffd21e'); g.addColorStop(1, '#ff6a00');
  c.fillStyle = g; c.fillText(game.banner, 0, 0);
  c.restore();
}
function drawFight(c) {
  c.save();
  if (game.shake > 0) { c.translate((Math.random() - 0.5) * game.shake * 2, (Math.random() - 0.5) * game.shake * 2); game.shake *= 0.85; if (game.shake < 0.5) game.shake = 0; }
  drawStage(c);
  // dessin : le combattant qui attaque passe devant
  const order = game.p[0].state === 'attack' ? [game.p[1], game.p[0]] : [game.p[0], game.p[1]];
  order.forEach(p => p.draw(c));
  game.projectiles.forEach(p => p.draw(c));
  updateDrawVfx(c);
  if (game.dark > 0) { c.fillStyle = 'rgba(10,0,25,' + (Math.min(30, game.dark) / 30) * 0.55 + ')'; c.fillRect(-20, -20, W + 40, H + 40); game.dark--; }
  // particules
  for (let i = fx.length - 1; i >= 0; i--) { const p = fx[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life--; if (p.life <= 0) { fx.splice(i, 1); continue; } c.globalAlpha = Math.min(1, p.life / 10); c.fillStyle = p.color; c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill(); }
  c.globalAlpha = 1;
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.y -= 0.8; t.life--; if (t.life <= 0) { texts.splice(i, 1); continue; } c.globalAlpha = Math.min(1, t.life / 15); c.font = 'bold 22px Cinzel, Impact'; c.textAlign = 'center'; c.strokeStyle = '#000'; c.lineWidth = 4; c.strokeText(t.str, t.x, t.y); c.fillStyle = t.color; c.fillText(t.str, t.x, t.y); }
  c.globalAlpha = 1;
  c.restore();
  if (game.flash > 0) { c.fillStyle = 'rgba(255,255,255,' + (game.flash / 20) * 0.7 + ')'; c.fillRect(0, 0, W, H); game.flash--; }
  drawHUD(c);
  if (NET.active) {
    c.font = '13px Arial'; c.textAlign = 'center'; c.fillStyle = '#9a9aa8';
    c.fillText('EN LIGNE · ping ' + Math.round(NET.rtt) + ' ms · délai ' + NET.delay + ' f', W / 2, 78);
    if (NET.waiting > 10) { c.font = 'bold 20px Arial'; c.fillStyle = '#ffd21e'; c.fillText('⏳ En attente de l\'adversaire…', W / 2, 110); }
    if (NET.desync) { c.font = 'bold 16px Arial'; c.fillStyle = '#ff5a4a'; c.fillText('Désynchronisation détectée — relancez un match', W / 2, 132); }
  }
  drawBanner(c);
  if (game.phase === 'ko' && game.phaseT > 60 && game.winner) {
    c.font = 'bold 34px Cinzel, Impact'; c.textAlign = 'center'; c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = 6;
    const s = game.winner.def.name + ' L\'EMPORTE'; c.strokeText(s, W / 2, H / 2 + 50); c.fillText(s, W / 2, H / 2 + 50);
  }
}

// ---- Écrans ---------------------------------------------------------------
function drawTitle(c) {
  game.t++;
  const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2a0507'); g.addColorStop(0.5, '#05050a'); g.addColorStop(1, '#070f2a');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // rayons
  c.save(); c.translate(W / 2, 200); c.globalAlpha = 0.08; c.fillStyle = '#fff';
  for (let i = 0; i < 12; i++) { c.rotate(Math.PI / 6); c.beginPath(); c.moveTo(0, 0); c.lineTo(900, -60); c.lineTo(900, 60); c.fill(); }
  c.restore();
  c.textAlign = 'center';
  c.font = '900 66px "Cinzel Decorative", Cinzel, Impact, Arial Black, sans-serif'; c.lineWidth = 10; c.strokeStyle = '#000'; c.strokeText('EMPYREAN FIGHTER', W / 2, 190);
  const g2 = c.createLinearGradient(0, 110, 0, 200); g2.addColorStop(0, '#fff3c4'); g2.addColorStop(0.5, '#d4a92c'); g2.addColorStop(1, '#7a4a0a');
  c.fillStyle = g2; c.fillText('EMPYREAN FIGHTER', W / 2, 190);
  c.font = 'bold 30px Cinzel, Impact'; c.fillStyle = FACTIONS.rebels.color; c.fillText('REBELLES', W / 2 - 150, 245);
  c.fillStyle = '#fff'; c.fillText('VS', W / 2, 245);
  c.fillStyle = FACTIONS.loyalists.color; c.fillText('LOYALISTES', W / 2 + 160, 245);
  const opts = ['1 JOUEUR  vs  IA', '2 JOUEURS', 'EN LIGNE', 'TOUCHES'];
  const diffs = ['FACILE', 'NORMAL', 'DIFFICILE'];
  opts.forEach((o, i) => {
    const sel = game.menu === i;
    c.font = 'bold 32px Cinzel, Impact'; c.fillStyle = sel ? '#ffd21e' : '#aaa'; c.fillText((sel ? '▶ ' : '') + o, W / 2, 300 + i * 40);
  });
  c.font = 'bold 20px Cinzel, Impact'; c.fillStyle = '#ccc'; c.fillText('DIFFICULTÉ IA :  ◀ ' + diffs[game.difficulty] + ' ▶   (gauche / droite)', W / 2, 450);
  c.font = '15px Arial'; c.fillStyle = '#9a9aa8'; c.fillText(controlsLine(0), W / 2, 478);
  if (assetsDone < assetsTotal) { c.font = '14px Arial'; c.fillStyle = '#d4a92c'; c.fillText('Chargement des animations… ' + Math.floor(assetsDone / assetsTotal * 100) + ' %', W / 2, 496); }
  else if (Math.floor(game.t / 30) % 2 === 0) { c.font = 'bold 22px Cinzel, Impact'; c.fillStyle = '#fff'; c.fillText('ENTRÉE / ESPACE pour valider', W / 2, 510); }
  inputs.forEach(i => i.poll());
  const any = a => inputs.some(i => i.pressed(a));
  if (any('up')) { game.menu = (game.menu + 3) % 4; SFX.select(); }
  if (any('down')) { game.menu = (game.menu + 1) % 4; SFX.select(); }
  if (any('left')) { game.difficulty = (game.difficulty + 2) % 3; SFX.select(); }
  if (any('right')) { game.difficulty = (game.difficulty + 1) % 3; SFX.select(); }
  if (any('start') || any('L') || any('H') || any('K')) {
    SFX.confirm();
    if (game.menu === 3) { game.screen = 'keys'; keysUI.row = 0; keysUI.col = 0; keysUI.rebinding = false; game.t = 0; return; }
    if (game.menu === 2) { game.screen = 'online'; NET.ui = 0; NET.sub = 0; NET.error = ''; clearInputs(); game.t = 0; return; }
    game.mode = game.menu === 1 ? '2p' : '1p';
    game.notice = (game.mode === '2p' && resolve2pConflict()) ? 'Touches en conflit : P1 passe sur ' + PRESETS[binds[0].preset].name : '';
    game.screen = 'select'; game.sel = [{ idx: 0, done: false }, { idx: 3, done: false }]; game.selTurn = 0; game.t = 0;
  }
}
function drawKeys(c) {
  game.t++;
  c.fillStyle = '#05050a'; c.fillRect(0, 0, W, H);
  c.textAlign = 'center'; c.font = 'bold 40px Cinzel, Impact'; c.lineWidth = 6; c.strokeStyle = '#000';
  c.strokeText('TOUCHES', W / 2, 56); c.fillStyle = '#d4a92c'; c.fillText('TOUCHES', W / 2, 56);
  const cols = [W / 2 - 40, W / 2 + 260], x0 = 120, y0 = 110, lh = 34;
  c.font = 'bold 22px Cinzel, Impact'; c.fillStyle = '#fff';
  c.fillText('JOUEUR 1', cols[0], y0 - 10); c.fillText('JOUEUR 2', cols[1], y0 - 10);
  const conflicts = bindConflicts();
  KEYS_ROWS.forEach((row, ri) => {
    const y = y0 + 24 + ri * lh;
    c.textAlign = 'left'; c.font = '18px Arial'; c.fillStyle = '#bbb';
    c.fillText(row === 'preset' ? 'Préréglage' : ACTION_LABELS[row], x0, y);
    for (let pi = 0; pi < 2; pi++) {
      const sel = keysUI.row === ri && keysUI.col === pi;
      let txt; if (row === 'preset') txt = '◀ ' + (PRESETS[binds[pi].preset] ? PRESETS[binds[pi].preset].name : 'Personnalisé') + ' ▶';
      else txt = (sel && keysUI.rebinding) ? 'Appuyez sur une touche…' : bindLabel(pi, row);
      const bad = row !== 'preset' && binds[pi][row].some(code => conflicts.includes(code));
      c.textAlign = 'center'; c.font = (sel ? 'bold ' : '') + '19px Arial';
      if (sel) { c.fillStyle = 'rgba(212,169,44,.18)'; c.fillRect(cols[pi] - 130, y - 20, 260, 28); }
      c.fillStyle = sel && keysUI.rebinding ? '#ffd21e' : bad ? '#d4a92c' : sel ? '#fff3c4' : '#ddd';
      c.fillText(txt, cols[pi], y);
    }
  });
  c.textAlign = 'center'; c.font = '15px Arial'; c.fillStyle = '#9a9aa8';
  c.fillText('↑ ↓ choisir · ← → changer de préréglage ou de joueur · Entrée : redéfinir la touche · Suppr : tout réinitialiser · Échap : retour', W / 2, 482);
  if (conflicts.length) { c.fillStyle = '#d4a92c'; c.fillText('En or : touches partagées par P1 et P2 (' + conflicts.map(keyLabel).join(', ') + ') — sans effet en 1 joueur, P1 bascule sur ZQSD + FGHJ en 2 joueurs', W / 2, 506); }
  else { c.fillStyle = '#7a7a88'; c.fillText('Touches physiques : le jeu affiche ce qui est écrit sur votre clavier. Sauvegardé automatiquement.', W / 2, 506); }
}
function drawSelect(c) {
  game.t++;
  c.fillStyle = '#0a0a12'; c.fillRect(0, 0, W, H);
  c.fillStyle = FACTIONS.rebels.dark; c.fillRect(0, 0, W / 2, H); c.fillStyle = FACTIONS.loyalists.dark; c.fillRect(W / 2, 0, W / 2, H);
  c.textAlign = 'center'; c.font = 'bold 44px Cinzel, Impact'; c.lineWidth = 6; c.strokeStyle = '#000';
  c.strokeText('CHOISISSEZ VOTRE COMBATTANT', W / 2, 60); c.fillStyle = '#fff'; c.fillText('CHOISISSEZ VOTRE COMBATTANT', W / 2, 60);
  c.font = 'bold 28px Cinzel, Impact'; c.fillStyle = FACTIONS.rebels.color; c.fillText('REBELLES', W / 4, 105); c.fillStyle = FACTIONS.loyalists.color; c.fillText('LOYALISTES', 3 * W / 4, 105);
  const cell = 180, gap = 24, x0 = W / 2 - (cell * 4 + gap * 3) / 2 - gap / 2, y0 = 130;
  ROSTER.forEach((id, i) => {
    const d = CHARS[id], fac = FACTIONS[d.faction];
    const x = x0 + i * (cell + gap) + (i >= 2 ? gap : 0), y = y0;
    c.fillStyle = '#111'; c.fillRect(x - 4, y - 4, cell + 8, cell + 8);
    const im = IMG['portrait_' + id];

    c.font = 'bold 22px Cinzel, Impact'; c.fillStyle = '#fff'; c.strokeStyle = '#000'; c.lineWidth = 4; c.strokeText(d.name, x + cell / 2, y + cell + 28); c.fillText(d.name, x + cell / 2, y + cell + 28);
    c.font = '15px Arial'; c.fillStyle = '#bbb'; c.fillText(d.title, x + cell / 2, y + cell + 48);
    // curseurs
    game.sel.forEach((s, pi) => {
      if (s.idx !== i) return;
      const col = pi === 0 ? '#ffd21e' : '#5ad2ff', blink = s.done || Math.floor(game.t / 8) % 2 === 0;
      if (!blink) return;
      c.strokeStyle = col; c.lineWidth = 5; c.strokeRect(x - 6 + pi * 4, y - 6 + pi * 4, cell + 12 - pi * 8, cell + 12 - pi * 8);
      c.fillStyle = col; c.font = 'bold 20px Cinzel, Impact'; c.fillText((pi === 0 ? 'P1' : game.mode === '1p' ? 'CPU' : 'P2') + (NET.active && pi === NET.me ? ' (vous)' : '') + (s.done ? ' ✓' : ''), x + (pi === 0 ? 34 : cell - 34), y + 22);
    });
  });
  // fiche
  const me = NET.active ? NET.me : game.selTurn;
  const cur = game.sel[me], d = CHARS[ROSTER[cur.idx]];
  c.font = '17px Arial'; c.fillStyle = '#ddd'; c.textAlign = 'center';
  const sp = d.moves.special, su = d.moves.super;
  const pi = (game.mode === '2p' && !NET.active) ? game.selTurn : 0;
  c.fillText('PV ' + d.hp + '   ·   Spécial : ' + sp.name + ' (↓↘→ + coup, ou ' + bindLabel(pi, 'S') + ')   ·   Super : ' + su.name + ' (jauge pleine, ' + keyLabel(binds[pi].down[0]) + ' + ' + bindLabel(pi, 'S') + ')', W / 2, 415);
  c.fillStyle = '#999'; c.fillText(NET.active ? ('EN LIGNE · salle ' + NET.code + ' · vous êtes P' + (NET.me + 1) + ' · ping ' + Math.round(NET.rtt) + ' ms · délai ' + NET.delay + ' frames' + (cur.done ? ' · en attente de l\'adversaire…' : '')) : ((game.mode === '1p' ? 'Choisissez P1 puis l\'adversaire IA' : 'P1 puis P2 choisissent') + (game.notice ? '   —   ' + game.notice : '')), W / 2, 445);
  c.fillText(controlsLine(pi), W / 2, 470);
  c.fillText('Bloquer : reculer · Bloquer bas : accroupi + reculer · Balayette : accroupi + pied · Anti-air : accroupi + lourd · Échap : retour', W / 2, 495);
  inputs.forEach(i => i.poll());
  if (NET.active) {
    const inp = inputs[0];
    if (!cur.done) {
      if (inp.pressed('left')) { cur.idx = (cur.idx + 3) % 4; SFX.select(); netSend({ t: 'sel', idx: cur.idx }); }
      if (inp.pressed('right')) { cur.idx = (cur.idx + 1) % 4; SFX.select(); netSend({ t: 'sel', idx: cur.idx }); }
      if (inp.pressed('L') || inp.pressed('H') || inp.pressed('K') || inp.pressed('start') || inp.pressed('S')) { cur.done = true; SFX.confirm(); netSend({ t: 'ok', idx: cur.idx }); netTryStart(); }
    }

  }
  const inp = game.mode === '2p' ? inputs[game.selTurn] : inputs[0];
  const alt = game.mode === '2p' ? null : inputs[1];
  const pr = a => inp.pressed(a) || (alt && alt.pressed(a));
  if (!cur.done) {
    if (pr('left')) { cur.idx = (cur.idx + 3) % 4; SFX.select(); }
    if (pr('right')) { cur.idx = (cur.idx + 1) % 4; SFX.select(); }
    if (pr('L') || pr('H') || pr('K') || pr('start') || pr('S')) {
      cur.done = true; SFX.confirm();
      if (game.selTurn === 0) { game.selTurn = 1; game.sel[1].idx = game.sel[0].idx < 2 ? 2 + Math.floor(Math.random() * 2) : Math.floor(Math.random() * 2); }
      else { startMatch(); }
    }
  }
}
window.addEventListener('keydown', e => { if (keyCode(e) === 'Escape' && game.screen !== 'keys' && game.screen !== 'online') { if (game.screen === 'select' || game.screen === 'result' || game.screen === 'fight' || game.screen === 'vs') { if (NET.active) netClose(); game.screen = 'title'; game.t = 0; musicStop(); } } });
function drawVS(c) {
  game.t++;
  const a = game.p[0].def, b = game.p[1].def;
  c.fillStyle = FACTIONS[a.faction].dark; c.fillRect(0, 0, W / 2, H); c.fillStyle = FACTIONS[b.faction].dark; c.fillRect(W / 2, 0, W / 2, H);
  const k = Math.min(1, game.t / 20);
  const ia = IMG['portrait_' + a.id], ib = IMG['portrait_' + b.id];
  const size = 340;
  if (ia) c.drawImage(ia, -200 + k * 260, 100, size, size); if (ib) c.drawImage(ib, W + 200 - k * 260 - size, 100, size, size);
  c.textAlign = 'center'; c.font = 'bold 120px Cinzel, Impact'; c.lineWidth = 12; c.strokeStyle = '#000'; c.strokeText('VS', W / 2, H / 2 + 40);
  c.fillStyle = '#ffd21e'; c.fillText('VS', W / 2, H / 2 + 40);
  c.font = 'bold 40px Cinzel, Impact'; c.fillStyle = '#fff'; c.lineWidth = 6;
  c.strokeText(a.name, 230, 480); c.fillText(a.name, 230, 480); c.strokeText(b.name, W - 230, 480); c.fillText(b.name, W - 230, 480);
  c.font = '18px Arial'; c.fillStyle = '#ccc'; c.fillText(FACTIONS[a.faction].name, 230, 505); c.fillText(FACTIONS[b.faction].name, W - 230, 505);
  if (game.t > 110) { game.screen = 'fight'; game.t = 0; musicPlay(); }
}
function drawResult(c) {
  game.t++;
  const w = game.matchWinner, fac = FACTIONS[w.def.faction];
  c.fillStyle = fac.dark; c.fillRect(0, 0, W, H);
  const im = IMG['portrait_' + w.def.id]; if (im) { c.globalAlpha = 0.9; c.drawImage(im, W / 2 - 170, 80, 340, 340); c.globalAlpha = 1; }
  c.textAlign = 'center'; c.font = 'bold 70px Cinzel, Impact'; c.lineWidth = 10; c.strokeStyle = '#000';
  c.strokeText(w.def.name + ' TRIOMPHE', W / 2, 70); c.fillStyle = '#ffd21e'; c.fillText(w.def.name + ' TRIOMPHE', W / 2, 70);
  c.font = 'bold 30px Cinzel, Impact'; c.fillStyle = fac.color; c.fillText('VICTOIRE DES ' + fac.name, W / 2, 460);
  if (Math.floor(game.t / 30) % 2 === 0) { c.font = '20px Arial'; c.fillStyle = '#fff'; c.fillText(NET.active && NET.again[NET.me] ? 'En attente de l\'adversaire…' : 'ENTRÉE : rejouer   ·   Échap : titre', W / 2, 505); }
  inputs.forEach(i => i.poll());
  if (NET.active) { if (game.t > 40 && !NET.again[NET.me] && inputs[0] && (inputs[0].pressed('start') || inputs[0].pressed('L') || inputs[0].pressed('H') || inputs[0].pressed('K'))) { NET.again[NET.me] = true; netSend({ t: 'again' }); netTryAgain(); } return; }
  if (game.t > 40 && inputs.some(i => i.pressed('start') || i.pressed('L') || i.pressed('H') || i.pressed('K'))) {
    game.screen = 'select'; game.sel = [{ idx: game.sel[0].idx, done: false }, { idx: game.sel[1].idx, done: false }]; game.selTurn = 0; game.t = 0; SFX.confirm();
  }
}

// ---------------------------------------------------------------- Boucle
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) {
    acc -= STEP;
    if (game.screen === 'fight') { game.t++; if (updateFight() === false) { acc = Math.min(acc, STEP * 3); break; } }
  }
  switch (game.screen) {
    case 'title': drawTitle(ctx); break;
    case 'keys': drawKeys(ctx); break;
    case 'online': drawOnline(ctx); break;
    case 'select': drawSelect(ctx); break;
    case 'vs': drawVS(ctx); break;
    case 'fight': drawFight(ctx); break;
    case 'result': drawResult(ctx); break;
  }
  schedule();
}
// rAF en priorité ; setTimeout de secours si le navigateur ne repeint pas (onglet en arrière-plan, volet intégré)
let scheduled = false;
function schedule() {
  if (scheduled) return; scheduled = true;
  let to = null;
  const id = requestAnimationFrame(() => { clearTimeout(to); scheduled = false; frame(performance.now()); });
  to = setTimeout(() => { cancelAnimationFrame(id); scheduled = false; frame(performance.now()); }, 50);
}
function fit() {
  const s = Math.min(window.innerWidth / W, (window.innerHeight - 30) / H);
  canvas.style.width = Math.floor(W * s) + 'px'; canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit); fit();
schedule();
